name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The publish workflow runs these same checks before it uploads.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # "lowest-direct" checks that the lower bounds in pyproject.toml still work.
        resolution: [highest, lowest-direct]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          if [ "${{ matrix.resolution }}" = "highest" ]; then
            uv sync --group dev --locked
          else
            uv sync --group dev --resolution lowest-direct
          fi

      # Lint once, with the locked ruff: older ruff versions format differently.
      - name: Lint with ruff
        if: matrix.resolution == 'highest'
        run: uv run --no-sync ruff check .

      - name: Check formatting
        if: matrix.resolution == 'highest'
        run: uv run --no-sync ruff format --check .

      - name: Run tests
        run: uv run --no-sync pytest tests/ -v -m "not integration"
