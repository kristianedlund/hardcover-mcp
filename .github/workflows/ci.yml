name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The publish workflow runs these same checks before it uploads.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # "lowest-direct" checks that the lower bounds in pyproject.toml still work.
        resolution: [highest, lowest-direct]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          if [ "${{ matrix.resolution }}" = "highest" ]; then
            uv sync --group dev --locked
          else
            uv sync --group dev --resolution lowest-direct
          fi

      # Lint once, with the locked ruff: older ruff versions format differently.
      - name: Lint with ruff
        if: matrix.resolution == 'highest'
        run: uv run --no-sync ruff check .

      - name: Check formatting
        if: matrix.resolution == 'highest'
        run: uv run --no-sync ruff format --check .

      - name: Run tests
        run: uv run --no-sync pytest tests/ -v -m "not integration"
